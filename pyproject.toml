[project]
name = "milgboost"
version = "0.1.0"
description = "Multiple Instance Learning for Gradient Boosting Models"
authors = [{ name = "杜世橋 Du Shiqiao", email = "lucidfrontier.45@gmail.com" }]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
keywords = ["machine-learning", "gradient-boosting", "multiple-instance-learning", "mil", "lightgbm", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/lucidfrontier45/milgboost"
Repository = "https://github.com/lucidfrontier45/milgboost"
Issues = "https://github.com/lucidfrontier45/milgboost/issues"

[project.optional-dependencies]
lightgbm = [
    "lightgbm>=4.6.0",
]
xgboost = [
    "xgboost>=3.2.0",
]
xgboost-cpu = [
    "xgboost-cpu>=3.2.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
managed = true

[tool.poe.tasks]
check = "pyrefly check ."
lint = "ruff check --fix ."
format = "ruff format ."
test = "pytest tests"

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "RUF",
    "UP",
    "N",
    "SIM",
    "A",
    "S",
    "DTZ",
    "PIE",
    "PLE",
]
# add directory names to exclude from analysis
exclude = ["tests/**/*", "deps/**/*"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ['F401']

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
